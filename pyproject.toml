[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pep2ccs"
version = "1.0.0"
description = "Peptide collision cross section prediction"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Zhimeng Tian" },
  { name = "Zizheng Nie" },
  { name = "Yong Zhang" },
  { name = "Daming Zhu" },
  { name = "Xuefeng Cui" },
]
dependencies = [
  "torch==2.2.2",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.4.2",
  "tqdm==4.66.4",
  "matplotlib==3.8.4",
  "seaborn==0.13.2",
  "pyyaml==6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
